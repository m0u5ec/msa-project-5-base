version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  airflow-init:
    image: apache/airflow:2.7.2-python3.11
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
    volumes:
      - ./dags:/opt/airflow/dags
    command: bash -c "airflow db init && airflow users create --username admin --firstname Admin --lastname Admin --role Admin --email admin@example.com --password admin"

  airflow-webserver:
    image: apache/airflow:2.7.2-python3.11
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      - LOAD_EXEMPLE=False
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - AIRFLOW__CORE__FERNET_KEY=fbZ9_U4Dx2yTa6_6e7u1V4U2E0aXbA9g7Z3c5B1a8sE=
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__WEBSERVER__BASE_URL=http://127.0.0.1:8081
    volumes:
      - ./dags:/opt/airflow/dags
    ports:
      - "8081:8080"
    command: airflow webserver

  airflow-scheduler:
    image: apache/airflow:2.7.2-python3.11
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      - LOAD_EXEMPLE=False
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - AIRFLOW__CORE__FERNET_KEY=fbZ9_U4Dx2yTa6_6e7u1V4U2E0aXbA9g7Z3c5B1a8sE=
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    volumes:
      - ./dags:/opt/airflow/dags
    command: airflow scheduler
